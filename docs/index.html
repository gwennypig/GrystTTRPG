<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gryst TTRPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gryst TTRPG - A momentum-based tabletop roleplaying game">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-size: 16px;
      --theme-color: #c9a227;
      --sidebar-width: 280px;
      --sidebar-background: #1a1a2e;
      --sidebar-nav-link-color: #e0e0e0;
      --sidebar-nav-link-color--active: #c9a227;
      --sidebar-nav-link-border-color--active: #c9a227;
      --content-max-width: 900px;
      --code-block-border-radius: 8px;
      --heading-color: #c9a227;
    }
    
    .sidebar-nav > ul > li > a {
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.05em;
    }
    
    .app-name {
      font-size: 1.5em !important;
      text-align: center;
      padding: 1em 0 !important;
    }
    
    /* Nice table styling */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    
    th, td {
      border: 1px solid #444;
      padding: 0.5em 1em;
      text-align: left;
    }
    
    th {
      background: #2a2a3e;
      color: #c9a227;
    }
    
    tr:nth-child(even) {
      background: #1e1e2e;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: '⚔️ Gryst TTRPG',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied!'
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →'
      }
    }
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>

</html>
