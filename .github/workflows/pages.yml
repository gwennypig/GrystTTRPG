name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Inject commit ID into README
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Commit SHA: $SHORT_SHA"
          echo "Before:"
          head -1 docs/README.md
          sed -i "1s/^# Gryst TTRPG/# Gryst TTRPG - ${SHORT_SHA}/" docs/README.md
          echo "After:"
          head -1 docs/README.md
      
      - name: Generate raw document
        run: |
          chmod +x generate-raw-doc.sh
          ./generate-raw-doc.sh docs
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
